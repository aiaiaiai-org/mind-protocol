name: Bootstrap Import CI

on:
  pull_request:
    paths:
      - .github/workflows/import-protocol-history.yml
      - .github/workflows/bootstrap-import-ci.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate guarded history import
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/import-protocol-history.yml"); YAML.load_file(".github/workflows/bootstrap-import-ci.yml")'

      - name: Validate import safety contract
        run: |
          set -euo pipefail
          workflow=.github/workflows/import-protocol-history.yml

          grep -Fq 'workflow_dispatch:' "$workflow"
          ! grep -Fq '  push:' "$workflow"
          grep -Fq 'EXPECTED_SOURCE_SHA: 48a81df7d8e9818d9c01f3e1fe5ac663af29a006' "$workflow"
          grep -Fq 'EXPECTED_DESTINATION_SHA:' "$workflow"
          grep -Fq 'github.sha' "$workflow"
          grep -Fq -- '--force-with-lease="refs/heads/master:${EXPECTED_DESTINATION_SHA}"' "$workflow"
          grep -Fq 'feature/protocol-history-import-bootstrap' "$workflow"

      - name: Verify pinned source master has not moved
        run: |
          set -euo pipefail
          expected=48a81df7d8e9818d9c01f3e1fe5ac663af29a006
          actual="$(git ls-remote https://github.com/0x0sky/mind.git refs/heads/master | awk '{print $1}')"
          test "$actual" = "$expected"
