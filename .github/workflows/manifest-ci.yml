name: Mind Contract CI

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - AGENTS.md
      - mind-repository.yaml
      - protocol.yaml
      - conformance.yaml
      - compatibility.yaml
      - schema/**
      - scripts/**
      - tests/**
      - modules/**
      - docs/REPOSITORY_MODEL.md
      - docs/protocol/**
      - .github/copilot-instructions.md
      - .github/workflows/manifest-ci.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - mind-repository.yaml
      - protocol.yaml
      - conformance.yaml
      - compatibility.yaml
      - schema/**
      - scripts/**
      - tests/**
      - modules/**
      - docs/REPOSITORY_MODEL.md
      - docs/protocol/**
      - .github/copilot-instructions.md
      - .github/workflows/manifest-ci.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate protocol contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate every published JSON Schema
        run: python scripts/validate_schemas.py

      - name: Validate protocol descriptor and pure-authority repository boundary
        run: python scripts/validate_protocol.py

      - name: Validate canonical visual asset fixtures
        run: python scripts/validate_visual_assets.py

      - name: Validate first-class agent Identity fixture
        run: python scripts/validate_agent_identity.py

      - name: Run dual-mode protocol conformance
        run: python scripts/validate_conformance.py --mode all

      - name: Validate compatibility freeze and migration policy
        run: python scripts/validate_compatibility.py

      - name: Validate reproducible neutral baseline
        run: python scripts/generate_baseline.py --check

      - name: Validate reproducible formal release bundle
        run: python scripts/build_release_bundle.py --check

      - name: Run validator, bootstrap, migration, repository, and release regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
