schema_version: 1
scope: repository_metadata
protocol_contract: false

repository:
  id: aiaiaiai-org/mind-protocol
  default_branch: master
  roles:
    protocol_authority:
      enabled: true
      canonical: true
      entrypoint: protocol.yaml
      release_authority: true
    concrete_mind:
      enabled: false

routing:
  protocol_definition: protocol.yaml
  protocol_conformance: conformance.yaml
  protocol_compatibility: compatibility.yaml
  repository_model: docs/REPOSITORY_MODEL.md
  new_mind_creation: docs/protocol/BOOTSTRAP.md
  release_policy: docs/protocol/RELEASE_POLICY.md

fork_policy:
  protocol_development:
    github_fork: allowed
    meaning: contribute_to_or_experiment_with_protocol_source
  concrete_mind_creation:
    github_fork_of_master: forbidden_as_template
    copy_concrete_mind_content: forbidden
    source: exact_immutable_protocol_release
    mechanism: neutral_bootstrap

bootstrap:
  command: scripts/bootstrap_mind.py
  input_authority: exact_protocol_release_tag
  floating_master: forbidden_for_release_consumption
  starts_from: generated_neutral_baseline
  requires_explicit:
    - subject
    - display_name
    - context_version
    - repository_visibility
  publication_owner:
    default: subject
    explicit_override: supported
    partial_override: forbidden

version_axes:
  protocol_version:
    authority: protocol.yaml
    tags_live_here: true
  concrete_context_version:
    authority: external_concrete_mind
    independent_from_protocol: true
    protocol_tags_must_not_be_used_as_context_tags: true

history:
  authority_split_source:
    repository: 0x0sky/mind
    commit: 48a81df7d8e9818d9c01f3e1fe5ac663af29a006
  first_formal_release:
    version: 0.9.0
    historical_repository: 0x0sky/mind
    immutable: true

invariants:
  - this_repository_contains_no_concrete_mind
  - protocol_contracts_do_not_depend_on_named_identity
  - protocol_contracts_do_not_depend_on_provider_repository_or_runtime
  - new_concrete_minds_are_bootstrapped_from_an_exact_protocol_release
  - protocol_consumers_do_not_source_contracts_from_floating_master
